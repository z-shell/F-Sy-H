; default theme, also embedded in the source of fast-syntax-highlighting

[theme]
palette = xterm-256
foreground = #ffffff
background = #000000
description = Classic F-Sy-H dark theme.

[base]
default          = none
unknown-token    = 210,bold
commandseparator = none
redirection      = none
here-string-tri  = yellow
here-string-text = 69
here-string-var  = cyan,bg:18
exec-descriptor  = yellow,bold
comment          = 243
correct-subtle   = 69
incorrect-subtle = 210
subtle-separator = green
subtle-bg        = bg:18
secondary        = free
recursive-base     = none

[command-point]
reserved-word  = yellow
subcommand     = yellow,bold
alias          = green
suffix-alias   = green
global-alias   = bg:blue
builtin        = green
function       = green
command        = green
precommand     = green
hashed-command = green
single-sq-bracket = green
double-sq-bracket = green
double-paren   = yellow

[paths]
path          = 13
pathseparator =
path-to-dir   = 13,underline
globbing      = 69,bold
globbing-ext  = 13

[brackets]
paired-bracket = bg:blue
bracket-level-1 = green,bold
bracket-level-2 = yellow,bold
bracket-level-3 = cyan,bold

[arguments]
single-hyphen-option   = cyan
double-hyphen-option   = cyan,bold
back-quoted-argument   = none
single-quoted-argument = yellow
double-quoted-argument = yellow
optarg-string          = yellow
dollar-quoted-argument = yellow

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = cyan
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = cyan

[other]
variable             = 113
assign               = none
assign-array-bracket = green
history-expansion    = 69,bold

[math]
mathvar = 69,bold
mathnum = 13
optarg-number = 13
matherr = 210

[for-loop]
forvar = none
fornum = 13
; operator
foroper = yellow
; separator
forsep = yellow,bold

[case]
case-input       = green
case-parentheses = yellow
case-condition   = bg:blue
