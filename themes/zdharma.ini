[theme]
palette = xterm-256
foreground = #ffffff
background = #000000

[base]
default          = none
unknown-token    = 210,bold
commandseparator = none
redirection      = none
here-string-tri  = 141
here-string-text = bg:19
here-string-var  = 177,bg:19
exec-descriptor  = yellow,bold
comment          = 243
correct-subtle   = bg:55
incorrect-subtle = bg:52
subtle-separator = none
subtle-bg        = bg:17
secondary        = safari
recursive-base   = 186

[command-point]
reserved-word  = 146
subcommand     = 117
alias          = 63
suffix-alias   = 63
global-alias   = bg:19
builtin        = 63
function       = 63
command        = 63
precommand     = 63
hashed-command = 63
single-sq-bracket = 63
double-sq-bracket = 63
double-paren   = 146

[paths]
path          = 154
pathseparator =
path-to-dir   = 154,underline
globbing      = 114
globbing-ext  = 153

[brackets]
paired-bracket = bg:blue
bracket-level-1 = 117
bracket-level-2 = 141
bracket-level-3 = 170

[arguments]
single-hyphen-option   = 177
double-hyphen-option   = 177,bold
back-quoted-argument   = none
single-quoted-argument = 146
double-quoted-argument = 146
optarg-string          = 146
dollar-quoted-argument = 146

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = 177
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = 177

[other]
variable             = none
assign               = none
assign-array-bracket = 63
history-expansion    = 69,bold

[math]
mathvar = 69,bold
mathnum = 154
optarg-number = 154
matherr = 210

[for-loop]
forvar = none
fornum = 154
; operator
foroper = 146
; separator
forsep = 109

[case]
case-input       = 63
case-parentheses = 141
case-condition   = bg:19
