version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  definitions:
    # This repository is consumed as a submodule, so `.git` is a file whose
    # gitdir is relative to the superproject. Anchor the check at the real
    # workspace instead of Trunk's sandbox copy.
    - name: git-diff-check
      commands:
        - name: lint
          run: git -C "${workspace}" diff --check ${target}
  disabled:
    - checkov
    - oxipng
    - shellcheck
    - shfmt
    - trivy
    - trufflehog
    - yamllint
  enabled:
    - gitleaks@8.30.1
    - git-diff-check
    - actionlint@1.7.12
    - markdownlint@0.49.1
    - prettier@3.9.6
runtimes:
  enabled:
    - go@1.24.11
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
