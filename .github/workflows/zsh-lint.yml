---
name: Zsh Lint

# Advisory zsh-lint analysis (z-shell/F-Sy-H#209). Observe mode reports
# findings without failing; parser errors, invalid configuration and tool
# failures still fail. Native syntax and ZUnit checks stay in zsh-n.yml and
# zunit.yml.

on:
  push:
    branches: [main]
    paths:
      - "F-Sy-H.plugin.zsh"
      - "lib/**"
      - "functions/**"
      - "chroma/**"
      - "completions/**"
      - "tools/**"
      - ".github/workflows/zsh-lint.yml"
      - "zsh-lint.json"
  pull_request:
    branches: [main]
    paths:
      - "F-Sy-H.plugin.zsh"
      - "lib/**"
      - "functions/**"
      - "chroma/**"
      - "completions/**"
      - "tools/**"
      - ".github/workflows/zsh-lint.yml"
      - "zsh-lint.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    name: Configured Zsh Lint
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/zsh-lint.yml@main
    with:
      # Every root below is a source root in zsh-lint.json.
      paths: |
        F-Sy-H.plugin.zsh
        lib
        functions
        chroma
        completions
        tools
      zsh-lint-ref: f6341241c398fd2a784452e75895dafb06186bbc # v1.6.0
      config: zsh-lint.json
      mode: observe
