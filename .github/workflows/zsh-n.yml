---
name: Zsh

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Zsh 5.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 # 20.04
    steps:
      - name: Install compatibility toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq git zsh
          zsh --version | grep -F 'zsh 5.8'

      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check native Zsh source
        shell: bash
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r -d '' file; do
            zsh -f -n "$file"
            index=$((index + 1))
            zsh -f -c 'zcompile -U -z "$1" "$2"' zsh \
              "$RUNNER_TEMP/source-${index}.zwc" "$file"
          done < <(
            find F-Sy-H.plugin.zsh chroma functions lib scripts share \
              -type f \( -name '*.ch' -o -name '*.zsh' -o -path 'functions/*' \) \
              -print0 | sort -z
          )
          test "$index" -gt 0

      - name: Run integration checks
        run: |
          zsh -f scripts/test-plugin-entrypoint.zsh
          zsh -f scripts/test-plugin-lifecycle.zsh noninteractive
          zsh -f -i scripts/test-plugin-lifecycle.zsh interactive
          zsh -f scripts/test-function-completion.zsh
          zsh -f scripts/test-git-chroma-regions.zsh

  current:
    name: Zsh 5.9.2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build Zsh 5.9.2
        env:
          ZSH_COMMIT: ddee3e7a751a4f03d5a1041fd44bb7af7bc0cebb
          ZSH_VERSION: 5.9.2
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/zsh-source"
          prefix="$RUNNER_TEMP/zsh-${ZSH_VERSION}"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/zsh-users/zsh.git
          git -C "$source_dir" fetch --depth 1 origin "$ZSH_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          (
            cd "$source_dir"
            ./Util/preconfig
            CFLAGS=-std=gnu17 ./configure --prefix="$prefix"
            make -j2
            make install.bin install.modules install.fns
          )
          "$prefix/bin/zsh" --version | grep -F "zsh ${ZSH_VERSION}"
          echo "$prefix/bin" >>"$GITHUB_PATH"

      - name: Check native Zsh source
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r -d '' file; do
            zsh -f -n "$file"
            index=$((index + 1))
            zsh -f -c 'zcompile -U -z "$1" "$2"' zsh \
              "$RUNNER_TEMP/source-${index}.zwc" "$file"
          done < <(
            find F-Sy-H.plugin.zsh chroma functions lib scripts share \
              -type f \( -name '*.ch' -o -name '*.zsh' -o -path 'functions/*' \) \
              -print0 | sort -z
          )
          test "$index" -gt 0

      - name: Run integration checks
        run: |
          zsh -f scripts/test-plugin-entrypoint.zsh
          zsh -f scripts/test-plugin-lifecycle.zsh noninteractive
          zsh -f -i scripts/test-plugin-lifecycle.zsh interactive
          zsh -f scripts/test-function-completion.zsh
          zsh -f scripts/test-git-chroma-regions.zsh

  required:
    name: Zsh
    if: ${{ always() }}
    needs: [compatibility, current]
    runs-on: ubuntu-latest
    steps:
      - name: Verify validation results
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          CURRENT_RESULT: ${{ needs.current.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$CURRENT_RESULT" = success
