---
name: Trunk Code Quality

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Trunk Code Quality
    uses: z-shell/.github/.github/workflows/trunk.yml@aa802adb4713acee89d4b95b04b04a1abf9a9377 # main
    with:
      arguments: --no-progress
