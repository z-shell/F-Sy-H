---
name: Commit Lint

# Thin caller for the organization policy suite: Conventional Commit messages
# and PR title (decisions/0003), advisory tool-credit warnings (AGENTS.md),
# branch-name shape (decisions/0019), and issue traceability on
# the pull request (decisions/0022). Runs on `edited` too, so fixing a title
# or adding the issue link re-evaluates without a push.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

# No concurrency group, here or in the called workflow (z-shell/zi#597): these
# required checks finish in seconds, and a cancelled run for a required context
# can keep a pull request blocked.

jobs:
  policy:
    name: Policy
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/commit-lint.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    with:
      # This repository keeps the narrower issue-only shape it always used.
      branch-pattern: "^(feature|bug|hotfix)-[1-9][0-9]*$"
