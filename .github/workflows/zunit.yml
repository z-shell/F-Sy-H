---
name: ZUnit

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ZUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -yq zsh
      - name: Build ZUnit 0.8.2
        run: |
          git init zunit.git
          git -C zunit.git remote add origin https://github.com/z-shell/zunit.git
          git -C zunit.git fetch --depth 1 origin 15061c83373be80b523988121b7ba12c6b2d82dc
          git -C zunit.git checkout --detach FETCH_HEAD
          zsh -f -c 'cd zunit.git && ./build.zsh'
          mkdir bin
          mv zunit.git/zunit bin/zunit
      - name: Run ZUnit
        env:
          TERM: xterm-256color
        run: PATH="$PWD/bin:$PATH" zunit

  required:
    name: ZUnit
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
