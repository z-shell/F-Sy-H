---
name: ZUnit

on:
  workflow_dispatch: {}
  push:
    paths:
      - "**/*.ch"
      - "**/*.zsh"
      - "tests/*"
      - "share/*"
      - "themes/*"
      - "functions/*"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ZUnit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -yq zsh
      - name: Build ZUnit 0.8.2
        run: |
          git init zunit.git
          git -C zunit.git remote add origin https://github.com/z-shell/zunit.git
          git -C zunit.git fetch --depth 1 origin 15061c83373be80b523988121b7ba12c6b2d82dc
          git -C zunit.git checkout --detach FETCH_HEAD
          zsh -f -c 'cd zunit.git && ./build.zsh'
          mkdir bin
          mv zunit.git/zunit bin/zunit
      - name: Run ZUnit
        env:
          TERM: xterm-256color
        run: PATH="$PWD/bin:$PATH" zunit

  required:
    name: ZUnit
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
