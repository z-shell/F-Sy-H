name: Documentation
description: Report missing, incorrect, or unclear F-Sy-H documentation
title: "docs: "
labels: ["type:docs", "area:docs", "status:triage"]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the affected repository or wiki page.
      placeholder: https://wiki.zshell.dev/ecosystem/plugins/f-sy-h
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, incorrect, outdated, or unclear?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Describe the correction or additional guidance you recommend.
  - type: checkboxes
    id: self_service
    attributes:
      label: Contribution
      options:
        - label: I am willing to help update this documentation.
  - type: checkboxes
    id: guidelines
    attributes:
      label: Contribution guidelines
      options:
        - label: I have read the [contribution guidelines](https://github.com/z-shell/.github/blob/main/.github/CONTRIBUTING.md).
          required: true
