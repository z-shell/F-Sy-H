name: Bug report
description: Report a reproducible F-Sy-H defect
title: "bug: "
labels: ["type:bug", "area:plugin", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a report. Report security-sensitive
        behavior through the private security advisory link instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and when does it happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Zsh version, operating system, F-Sy-H commit, and loading method.
      value: |
        - Zsh version:
        - Operating system:
        - F-Sy-H commit:
        - Loading method or plugin manager:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a minimal Zsh configuration and the exact steps that reproduce the problem.
      render: zsh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant terminal output or screenshots, with secrets and personal data removed.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other information that helps explain or reproduce the defect.
  - type: checkboxes
    id: guidelines
    attributes:
      label: Contribution guidelines
      options:
        - label: I have read the [contribution guidelines](https://github.com/z-shell/.github/blob/main/.github/CONTRIBUTING.md).
          required: true
