name: Feature request
description: Propose an improvement to F-Sy-H
title: "feat: "
labels: ["type:feature", "area:plugin", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user need or limitation should this proposal address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and include an example when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note any expected effect on themes, chroma functions, plugin managers, or supported Zsh versions.
  - type: checkboxes
    id: self_service
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this proposal.
  - type: checkboxes
    id: guidelines
    attributes:
      label: Contribution guidelines
      options:
        - label: I have read the [contribution guidelines](https://github.com/z-shell/.github/blob/main/.github/CONTRIBUTING.md).
          required: true
